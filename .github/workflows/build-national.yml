name: Build Pokédex 1.3 IPA

on:
  push:
    branches: [national-pokedex]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: national-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prepare the selected training artifact
        run: |
          set -euo pipefail
          test -f TrainingResources/national-best.pt
          mkdir -p artifacts/multidomain
          cp TrainingResources/training-labels.json artifacts/multidomain/training-labels.json
          python -m venv .export-env
          .export-env/bin/python -m pip install 'coremltools==9.0' 'torch==2.13.0' 'torchvision==0.28.0' 'numpy==2.4.6' 'pillow==13.0.0'
      - name: Export and numerically validate the FP32 model
        run: |
          set -euo pipefail
          .export-env/bin/python scripts/multidomain/export.py --checkpoint TrainingResources/national-best.pt --out artifacts/multidomain/export --deployment iOS18
          .export-env/bin/python scripts/multidomain/validate_and_publish.py
      - name: Test catalog, inference, audio, and layouts
        run: |
          set -euo pipefail
          # Avoid competing simulator clones and wait for SpringBoard to boot.
          device_id=$(xcrun simctl list devices available -j | python -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"] == "iPhone Duo"))')
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild test -project iDex.xcodeproj -scheme iDex \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -resultBundlePath artifacts/multidomain/Tests.xcresult \
            -only-testing:iDexTests/CatalogTests \
            -only-testing:iDexTests/RecognitionTests \
            -only-testing:iDexTests/SelectedModelTests \
            -only-testing:iDexTests/PokemonCryTests \
            -only-testing:iDexTests/ScannerLayoutTests \
            -only-testing:iDexTests/FormCatalogTests \
            -only-testing:iDexTests/NarratorVoiceTests \
            -only-testing:iDexTests/DeviceAudioTests \
            -only-testing:iDexTests/AudioPlaybackTests/silentNativeSpeechReportsItsActualStartAndFinish \
            -only-testing:iDexUITests \
            CODE_SIGNING_ALLOWED=NO
      - name: Export readable test results and screenshots
        if: always()
        run: |
          if [ -d artifacts/multidomain/Tests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path artifacts/multidomain/Tests.xcresult > artifacts/multidomain/reports/ios-tests.json
            cat artifacts/multidomain/reports/ios-tests.json
            xcrun xcresulttool export attachments --path artifacts/multidomain/Tests.xcresult --output-path artifacts/multidomain/screenshots
          fi
      - name: Build the iPhone app
        run: |
          set -euo pipefail
          xcodebuild build -project iDex.xcodeproj -scheme iDex -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM=''
          mkdir -p output/Payload
          cp -R build/Build/Products/Release-iphoneos/iDex.app output/Payload/
          cd output
          zip -q -r Pokedex-1.3-unsigned.ipa Payload
          unzip -tq Pokedex-1.3-unsigned.ipa
      - name: Verify the final IPA before upload
        run: .export-env/bin/python scripts/multidomain/verify_ipa.py output/Pokedex-1.3-unsigned.ipa --out artifacts/multidomain/reports/ipa-verification.json
      - name: Keep the validated model in this development branch
        if: github.ref_name == 'national-pokedex'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A iDex/Recognition
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle validated form-aware Pokédex classifier'
            git push origin HEAD:national-pokedex
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: Pokedex-IPA
          path: output/Pokedex-1.3-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Pokedex-validation
          path: |
            artifacts/multidomain/reports/coreml-parity.json
            artifacts/multidomain/reports/ios-tests.json
            artifacts/multidomain/reports/ipa-verification.json
            artifacts/multidomain/export/export_receipt.json
            artifacts/multidomain/screenshots
            artifacts/multidomain/Tests.xcresult
          retention-days: 7
